name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            cflags: ''
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            cflags: ''
          - target: macos-arm64
            runner: macos-latest
            cflags: -arch arm64
          - target: macos-x86_64
            runner: macos-latest
            cflags: -arch x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Build clive-${{ matrix.target }}
        run: |
          VERSION="${{ github.ref_name }}"
          gcc ${{ matrix.cflags }} -Wall -Wextra -pedantic -std=c99 \
            -DCLIVE_VERSION=\"$VERSION\" \
            -o clive-${{ matrix.target }} clive.c

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clive-${{ matrix.target }}
          path: clive-${{ matrix.target }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
